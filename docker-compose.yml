services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school"]
      interval: 3s
      timeout: 3s
      retries: 20
  maildev:
    image: maildev/maildev:2.1.0
    ports: ["1025:1025", "1080:1080"]
