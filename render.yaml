# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two free web services out of one pnpm monorepo. See docs/deployment.md for
# the steps an operator takes around this file.
#
# The database is deliberately NOT declared here. Render deletes a free
# Postgres instance 30 days after it is created, taking its data with it, so
# the database lives on Neon's free tier instead and reaches the API through
# DATABASE_URL.
services:
  - type: web
    name: school-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --prod=false is explicit rather than load-bearing: pnpm 10.33.3 installs
    # devDependencies even under NODE_ENV=production (verified), but npm and
    # older pnpm prune them, and this build needs @nestjs/cli, next, prisma
    # and typescript — all devDependencies. The flag makes the build immune to
    # how the platform sets NODE_ENV.
    #
    # The root install also runs @school/api's postinstall (prisma generate);
    # without it @prisma/client exports no models and the build fails.
    buildCommand: npm install -g pnpm@10.33.3 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @school/api build
    # Migrations run here rather than in a preDeployCommand, which is a paid
    # plan feature. The free plan runs a single instance, and Prisma takes an
    # advisory lock regardless, so concurrent migrations are not a concern.
    #
    # The catalogue seed can run alongside them, because `migrate deploy`
    # creates the shop's tables and puts nothing in them — without it a
    # deployed catalogue is empty. It is gated on SEED_CATALOGUE_ON_BOOT
    # rather than being unconditional, because "the running code owns the
    # catalogue's contents" is true of *this* demonstration and false of most
    # deployments: a start command re-runs on every boot, not every deploy —
    # a free instance boots each time it wakes — and an unconditional seed
    # would also overwrite whatever an admin had edited. The flag makes that
    # a decision about one environment instead of a property of the code.
    #
    # It is allowed to fail without taking the API down: an empty catalogue is
    # a worse page, not a broken service, and the reason is in the log either
    # way. A failed migration still stops the boot.
    #
    # The demo accounts are NOT seeded here at all. `db:seed:accounts` creates
    # only what is missing and would be safe too, but who may sign in to a
    # deployment is the operator's decision — see docs/deployment.md.
    startCommand: >-
      pnpm --filter @school/api exec prisma migrate deploy &&
      if [ "$SEED_CATALOGUE_ON_BOOT" = "true" ]; then
      pnpm --filter @school/api db:seed:catalogue ||
      echo "WARNING - the catalogue seed failed, so the shop will be empty until it succeeds";
      else
      echo "SEED_CATALOGUE_ON_BOOT is not true, so the catalogue was left alone";
      fi &&
      pnpm --filter @school/api exec node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # school-web.onrender.com and school-api.onrender.com are different
      # *sites* to a browser — onrender.com is on the Public Suffix List — so
      # the session cookies need SameSite=None; Secure or sign-in silently
      # fails. See apps/api/src/common/config.ts.
      - key: CROSS_SITE_COOKIES
        value: "true"
      # This deployment is a demonstration whose catalogue is whatever the
      # code says it is, so it is seeded on every boot. Turn this off (or drop
      # it) for a deployment whose products are edited anywhere but in the
      # repository — otherwise a restart reverts those edits. The seed can
      # still be run by hand from the service shell at any time.
      - key: SEED_CATALOGUE_ON_BOOT
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Prompted for at Blueprint creation. Use Neon's *direct* connection
      # string, not the pooled one: prisma migrate deploy does not work
      # through PgBouncer, and one long-lived instance gains nothing from
      # pooling.
      - key: DATABASE_URL
        sync: false
      # https://school-web.onrender.com — the CORS origin the API accepts and
      # the base of the password reset link.
      - key: APP_URL
        sync: false

  - type: web
    name: school-web
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install -g pnpm@10.33.3 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @school/web build
    startCommand: pnpm --filter @school/web exec next start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # https://school-api.onrender.com. Next.js inlines NEXT_PUBLIC_* into the
      # client bundle at BUILD time, so changing this needs a redeploy, not a
      # restart.
      - key: NEXT_PUBLIC_API_URL
        sync: false
